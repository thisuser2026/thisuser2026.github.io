<!DOCTYPE html>
<html lang="en">
    <head>
        <title>thisuser2000</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Portfolio website for a user">
		<link rel="stylesheet" href="styles/main.css">
		<link rel="stylesheet" href="styles/navbar.css">
		<link rel="stylesheet" href="styles/modal.css">
		<link rel="stylesheet" href="styles/color.css">
		<link rel="stylesheet" href="styles/display.css">
        <link rel="stylesheet" href="styles/custom-video-player.css">
		<link rel="icon" type="image/x-icon" href="assets/favicon.png">
    </head>
    <body>

		<nav class="navbar">
			<img class="logo" src="assets/icons/thisuser.svg"/>
			<a class="navbar-page" href="renders.html">
				<img src="assets/icons/renders.svg"/>
				<span>Renders</span>
			</a>
			<a class="navbar-pageCurrent" href="animations.html">
				<img src="assets/icons/animations.svg"/>
				<span>Animations</span>
			</a>
			<a class="navbar-page" href="software.html">
				<img src="assets/icons/software.svg"/>
				<span>Software</span>
			</a>
			<a class="navbar-page" href="writing.html">
				<img src="assets/icons/writing.svg"/>
				<span>Writing</span>
			</a>
			<div id="menuButton" onclick="toggleMenu()">
				<img src="assets/icons/menu.svg"/>
			</div>
			<div class="navbar-divider"></div>
        </nav>

		<div id="menu">
			<a class="menu-page" href="renders.html">
				<img src="assets/icons/renders.svg"/>
				<span>Renders</span>
			</a>
			<div class="menu-divider"></div>
			<a class="menu-pageCurrent" href="animations.html">
				<img src="assets/icons/animations.svg"/>
				<span>Animations</span>
			</a>
			<div class="menu-divider"></div>
			<a class="menu-page" href="software.html">
				<img src="assets/icons/software.svg"/>
				<span>Software</span>
			</a>
			<div class="menu-divider"></div>
			<a class="menu-page" href="writing.html">
				<img src="assets/icons/writing.svg"/>
				<span>Writing</span>
			</a>
		</div>

		<div id="content" onclick="hideMenu()">

			<div class="banner" style="background-image: url('assets/media/banner.webp');">
	            <div class="banner-gradient">
					<div style="margin: auto;">
						<p class="banner-title">Animations</p>
						<p class="banner-subtitle">Tap on a card to learn more</p>
					</div>
	            </div>
	        </div>


			<!-- Characters -->
			<section class="section-top section-bottom">
	            <div class="container">
					<p class="section-title">All</p>
					<div class="divider"></div>
					<div class="grid">

						<div class="card"
							data-project="hold"
							data-bs-toggle="modal"
							data-bs-target="#art-modal"
							style="background-image:url('assets/media/animations/hold/hold-1.webp')">

							<div class="card-glare"></div>
							<div class="card-gradient">
								<p class="card-text">Moving Hold</p>
							</div>
						</div>

						<div class="card"
							data-project="sole"
							data-bs-toggle="modal"
							data-bs-target="#art-modal"
							style="background-image:url('assets/media/animations/sole/sole-1.webp')">

							<div class="card-glare"></div>
							<div class="card-gradient">
								<p class="card-text">My Name is Sole Letafu</p>
							</div>
						</div>

						<div class="card"
							data-project="party"
							data-bs-toggle="modal"
							data-bs-target="#art-modal"
							style="background-image:url('assets/media/animations/party/party-1.webp')">

							<div class="card-glare"></div>
							<div class="card-gradient">
								<p class="card-text">The Party Room</p>
							</div>
						</div>

	                </div>
	            </div>
	        </section>

			<div class="footer">
	            <p>&copy; 2026 thisuser2000. All rights reserved.</p>
	        </div>

		</div>

		<div class="modal fade" id="art-modal" tabindex="-1">
			<div class="modal-dialog standard-dialog">
				<div class="modal-content">
					<div class="modal-section1">
						<h1 id="modal-title"></h1>
						<h2 id="modal-date"></h2>
						<div class="slideshow">
							<div style="display: none;">
								<img class="slideshow-feature" id="modal-image">
								<div class="slideshow-overlay">
									<div class="slideshow-left">
										<img src="assets/icons/caret-left.svg"/>
									</div>
									<div class="slideshow-right">
										<img src="assets/icons/caret-right.svg"/>
									</div>
								</div>
								<div class="slideshow-counter">
									<p class="slideshow-ID"></p>
								</div>
							</div>
							<div class="video-player" id="player" style="">
								<div style="position: absolute; display: flex; width: 100%; height: 100%; align-items: center;">
									<video class="modal-video" id="video" preload="metadata">
									</video>
								</div>
								<div class="controls">
								    <button id="play">
										<img id="play-img" src="assets/icons/player/play-fill.svg"/>
									</button>

								    <span id="current" style="margin-left: 16px;">0:00</span>

								    <input
								      id="progress"
								      type="range"
								      min="0"
								      max="100"
								      value="0"
								    />

								    <span id="duration" style="margin-right: 16px;">0:00</span>

								    <button id="sound" style="margin-right: 8px;">
										<img id="sound-img" src="assets/icons/player/volume-up-fill.svg"/>
									</button>

								    <button id="fullscreen">
										<img id="fullscreen-img" src="assets/icons/player/fullscreen.svg"/>
									</button>
								</div>
							</div>
						</div>
					</div>

					<div class="modal-section2">
						<h3>ABOUT THIS PIECE</h3>
						<div class="modal-description" id="modal-description"></div>
					</div>

				</div>
			</div>
		</div>

		<script src="scripts/bootstrap.bundle.min.js"></script>
		<script src="scripts/preload.js"></script>
		<script src="scripts/navbar.js"></script>
		<script src="scripts/modal.js"></script>
		<script src="scripts/project-data.js"></script>
		<script src="scripts/custom-video-player.js" defer></script>

    </body>
</html>
